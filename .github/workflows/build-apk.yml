name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  apk:
    name: APK release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Análisis estático
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Licencias del Android SDK
        run: yes | flutter doctor --android-licenses >/dev/null || true

      - name: APK release
        run: flutter build apk --release

      - name: Publicar APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: wisp-configurador-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
