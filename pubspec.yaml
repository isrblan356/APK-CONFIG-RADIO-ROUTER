name: wisp_configurator
description: APK offline-first para configurar radios Ubiquiti (AirOS M/AC) y routers TP-Link. Todo instalado en el móvil + sync híbrido opcional.
publish_to: 'none'
version: 1.1.3+5

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  # 2.14.0 no compila con Dart >= 3.7 (error de no-promoción tras await en
  # sftp_client.dart). 2.22.5+ exige pointycastle ^4 por eso van juntos.
  dartssh2: ^2.22.5
  http: ^1.2.1
  sqflite: ^2.3.3
  path: ^1.9.0
  # OJO: no agregues path_provider aquí. No se usa (sqflite trae
  # getDatabasesPath) y arrastra objective_c, cuyo hook nativo rompe
  # `flutter test` / `flutter build` en rutas con espacios (ej. C:\Users\ISRAEL B\...).
  # path_provider: ^2.1.3
  crypto: ^3.0.3
  pointycastle: ^4.0.0
  connectivity_plus: ^6.0.3
  permission_handler: ^11.3.1
  network_info_plus: ^6.0.0
  equatable: ^2.0.5
  dartz: ^0.10.1
  logger: ^2.3.0
  shared_preferences: ^2.2.3
  camera: ^0.12.1
  sensors_plus: ^7.1.1
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.3
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  # Flutter solo embebe los archivos DIRECTOS de un directorio listado:
  # cada subcarpeta (modelo) necesita su propia entrada.
  assets:
    - assets/seed/
    - assets/firmware/manifest.json
    - "assets/firmware/PowerBeam M5 400 XW/"
    - "assets/firmware/NanoBeam 5AC 16/"
    - assets/templates/ct
    - "assets/templates/PowerBeam M5 400 XW/"
    - "assets/templates/PowerBeam M5 300 XW/"
    - "assets/templates/LiteBeam M5 XW/"
    - "assets/templates/NanoBeam 5AC 16/"
